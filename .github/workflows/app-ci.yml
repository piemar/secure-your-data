name: app-ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run Playwright E2E suite
        required: false
        default: false
        type: boolean

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking while baseline debt exists)
        run: npm run lint
        continue-on-error: true

      - name: Frontend tests
        run: npm test

      - name: Server tests
        run: npm run test:server

      - name: Frontend build
        run: npm run build

      - name: Server build
        run: npm run build --prefix server

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    if: >-
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e
