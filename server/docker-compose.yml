version: '3.8'

services:
  api:
    build: .
    ports:
      - '3001:3001'
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=mongodb_mayhem
      - JWT_SECRET=local-dev-secret-change-in-production
      - PORT=3001
      - CORS_ORIGIN=http://localhost:8080
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
